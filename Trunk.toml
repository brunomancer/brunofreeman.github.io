[build]
target = "index.html"
dist = "dist"
public_url = "/"

[watch]
ignore = ["dist"]

[serve]
port = 8080
open = false

# Generate short-link redirect pages from redirects/redirects.txt (see redirects/redirects.sh).
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["redirects/redirects.sh"]
