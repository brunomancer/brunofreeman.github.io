[build]
target = "index.html"
dist = "dist"
public_url = "/"

[watch]
ignore = ["dist"]

[serve]
port = 8080
open = false

# Generate short-link redirect pages from redirects/redirects.sexp (see redirects/src/main.rs).
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--quiet", "--package", "redirects"]
